name: Sync publications

on:
  schedule:
    # Weekly, Monday 03:17 UTC (off-peak minute to avoid burst traffic).
    - cron: "17 3 * * 1"
  workflow_dispatch:
  push:
    paths:
      - "sync_publications.py"
      - ".github/workflows/sync-publications.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync publications from ADS library
        env:
          ADS_API_TOKEN: ${{ secrets.ADS_API_TOKEN }}
        run: python sync_publications.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/source/publications_auto.rst
          if git diff --cached --quiet; then
            echo "No changes to publications."
          else
            git commit -m "chore: sync publications from ADS library"
            git push
          fi
